media:
  - name: images
    label: 圖片
    input: assets/images
    output: /assets/images
    categories:
      - image
    rename: safe

  - name: videos
    label: 影片
    input: assets/videos
    output: /assets/videos
    categories:
      - video
    extensions:
      - mp4
      - webm
    rename: safe
content:
  - name: posts
    label: 文章管理
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{fields.slug}.md"

    view:
      fields:
        - title
        - category
        - date
        - updated
      primary: title
      search:
        - title
        - description
        - category
        - tags
      default:
        sort: date
        order: desc

    fields:

      # ========================
      # ① 基本資料
      # ========================

      - name: title
        label: 文章標題
        type: string
        required: true

      - name: slug
        label: 網址 Slug
        type: string
        required: true
        description: "英文網址名稱，例如 line-pos-integration"

      - name: category
        label: 文章分類
        type: select
        required: true
        options:
          values:
            - LINE 官方帳號
            - 美業經營管理
            - 數位工具教學
            - 產業知識

      - name: tags
        label: 標籤
        type: string
        list: true
        description: "例如 LINE、Messaging API、Webhook、會員"

      - name: date
        label: 發布日期
        type: date
        required: true

      - name: updated
        label: 最後更新日期
        type: date
        description: "文章有實質更新時再填寫"

      - name: description
        label: 文章摘要
        type: text
        required: true
        description: "簡短說明這篇文章在回答什麼問題，也會作為文章列表摘要使用"

      - name: image
        label: 封面圖片
        type: image

      - name: image_alt
        label: 封面圖片 ALT
        type: string
        description: "描述圖片實際內容，請勿單純堆疊關鍵字"

      # 作者固定為 isoPOS，不在編輯畫面顯示
      - name: author
        label: 作者
        type: string
        default: "isoPOS"
        hidden: true

      # ========================
      # ② 文章內容
      # ========================

      - name: body
        label: 文章內容
        type: rich-text
        required: false
        description: "直接使用視覺化編輯器撰寫；需要進階排版時可切換 Source 編輯原始碼"
        options:
          format: html
          switcher: true
          media: images
          rename: safe

                # ========================
      # 新版文章區塊（測試）
      # ========================

      - name: article_sections
        label: 新版文章內容
        type: block
        list: true
        required: false
        blockKey: type

        blocks:

          # 一般文章內容
          - name: text
            label: 一般文章內容
            fields:
              - name: content
                label: 內容
                type: rich-text
                required: true
                options:
                  format: html
                  switcher: false
                  media: true
                  path: assets/images
                  rename: safe

          # H4
          - name: h4
            label: H4 小標題
            fields:
              - name: text
                label: 標題
                type: string
                required: true

          # 重點提示
          - name: tip
            label: 重點提示
            fields:
              - name: title
                label: 標題
                type: string
                default: "重點提示"

              - name: text
                label: 內容
                type: text
                required: true

          # 注意事項
          - name: warning
            label: 注意事項
            fields:
              - name: title
                label: 標題
                type: string
                default: "注意事項"

              - name: text
                label: 內容
                type: text
                required: true

          # 步驟
          - name: step
            label: 步驟區塊
            fields:
              - name: number
                label: 步驟編號
                type: string
                required: true
                description: "例如 01"

              - name: title
                label: 步驟標題
                type: string
                required: true

              - name: content
                label: 步驟內容
                type: rich-text
                required: true
                options:
                  format: html
                  switcher: false
                  media: true
                  path: assets/images
                  rename: safe

          # 補充資訊
          - name: note
            label: 補充資訊
            fields:
              - name: title
                label: 標題
                type: string
                default: "補充資訊"

              - name: text
                label: 內容
                type: text
                required: true

          # 官方來源
          - name: source
            label: 官方來源
            fields:
              - name: label
                label: 顯示文字
                type: string
                required: true
                description: "例如 Notion 官方網站"

              - name: url
                label: 網址
                type: string
                required: true

          # 延伸閱讀
          - name: related
            label: 延伸閱讀
            fields:
              - name: title
                label: 文章名稱
                type: string
                required: true

              - name: url
                label: 文章網址
                type: string
                required: true

          # YouTube
          - name: youtube
            label: YouTube 影片
            fields:
              - name: video_id
                label: YouTube 影片 ID
                type: string
                required: true
                description: "例如網址 https://youtu.be/1nIsbRfEGK4，只填 1nIsbRfEGK4"

              - name: title
                label: 影片標題
                type: string
                required: true

          # 圖片
          - name: image
            label: 圖片
            fields:
              - name: image
                label: 圖片
                type: image
                required: true
                options:
                  path: assets/images
                  rename: safe

              - name: alt
                label: 圖片 ALT
                type: string
                required: true

              - name: caption
                label: 圖片說明
                type: string
                required: false

      # ========================
      # ③ GEO / AI 搜尋
      # ========================

      - name: quick_answer
        label: 快速解答
        type: text
        required: true
        description: "用 2～4 句直接回答文章核心問題，讓搜尋引擎與 AI 更容易理解文章答案"

      - name: key_takeaways
        label: 重點整理
        type: string
        list: true
        description: "每一項放一個重點，建議 3～6 項"

      - name: sources
        label: 參考來源
        type: string
        list: true
        description: "重要事實優先放官方或第一手來源，例如 LINE Developers"

      # ========================
      # ④ SEO 進階設定
      # ========================

      - name: seo_title
        label: SEO 標題
        type: string
        description: "選填。留白時使用文章標題；只有需要不同的 Google 搜尋標題時才填"

      - name: meta_description
        label: Meta Description
        type: text
        description: "選填。留白時可使用文章摘要；需要另外撰寫搜尋結果摘要時再填"

      - name: canonical
        label: Canonical URL
        type: string
        description: "進階設定。一般文章請留白，由網站自動產生"

      - name: noindex
        label: 不允許搜尋引擎索引
        type: boolean
        default: false
        description: "進階設定。一般正式文章請保持關閉"
