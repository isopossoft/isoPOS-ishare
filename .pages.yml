media:
  # ========================
  # 圖片
  # ========================
  - name: images
    label: 圖片
    input: assets/images
    output: /assets/images
    categories:
      - image
    rename: safe

  # ========================
  # 影片
  # ========================
  - name: videos
    label: 影片
    input: assets/videos
    output: /assets/videos
    categories:
      - video
    extensions:
      - mp4
      - webm
    rename: safe


content:
  - name: posts
    label: 文章管理
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{fields.slug}.md"

    # ========================
    # 文章列表設定
    # ========================
    view:
      fields:
        - title
        - category
        - date
        - updated

      primary: title

      search:
        - title
        - category
        - tags
        - quick_answer
        - meta_description

      default:
        sort: date
        order: desc


    fields:

      # ==================================================
      # ① 基本資料
      # ==================================================

      - name: title
        label: 文章標題
        type: string
        required: true


      - name: slug
        label: 網址 Slug
        type: string
        required: true
        description: "英文網址名稱，例如 line-pos-integration"
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "只能使用英文小寫、數字與連字號 -"


      - name: category
        label: 文章分類
        type: select
        required: true
        options:
          values:
            - LINE 官方帳號
            - 美業經營管理
            - 數位工具教學
            - 產業知識


      - name: tags
        label: 標籤
        type: string
        list: true
        required: false
        description: "例如 Notion、Notion教學、LINE、POS、會員。文章前台會顯示成可點擊標籤。"


      - name: date
        label: 發布日期
        type: date
        required: true


      - name: updated
        label: 最後更新日期
        type: date
        required: false
        description: "只有文章內容有實質更新時再填寫"


      # ========================
      # 封面圖片
      # ========================

      - name: image
        label: 封面圖片
        type: image
        required: false
        options:
          media: images
          rename: safe


      - name: image_alt
        label: 封面圖片 ALT
        type: string
        required: false
        description: "有使用封面圖片時請填寫，例如：Notion 網站發布功能操作畫面。描述圖片內容，不要堆疊關鍵字。"


      # ========================
      # 作者固定
      # ========================

      - name: author
        label: 作者
        type: string
        required: false
        default: "isoPOS"
        description: "顯示在文章標題下方的作者名稱。留白時使用 isoPOS，也可以填個人或團隊名稱。"



      # ==================================================
      # ② 快速解答
      # ==================================================

      - name: quick_answer
        label: 快速解答｜選填
        type: text
        required: false
        description: "選填。建議用 2～4 句直接回答文章核心問題，讓讀者與搜尋引擎快速理解答案。"



      # ==================================================
      # ③ 舊版文章內容
      # ==================================================
      #
      # 保留 body 是為了相容原本已經建立的文章。
      # 新文章建議主要使用下方「新版文章內容」。
      #
      # 這裡關閉圖片上傳，
      # 圖片請使用「圖片」文章區塊，
      # 才能確保每一張圖都有 ALT。
      # ==================================================

      - name: body
        label: 舊版文章內容
        type: rich-text
        required: false
        description: "舊文章相容欄位。新文章建議改用下方「新版文章內容」編輯。"
        options:
          format: html
          switcher: true
          media: false



      # ==================================================
      # ④ 新版文章內容
      # ==================================================

      - name: article_sections
        label: 新版文章內容
        type: block
        list:
          collapsible:
            collapsed: false
        required: false
        blockKey: type

        blocks:


          # ==================================================
          # 一般文章內容
          # ==================================================

          - name: text
            label: 一般文章內容

            fields:
              - name: content
                label: 內容
                type: rich-text
                required: true
                description: "一般段落文字。圖片請另外新增「圖片」區塊，才能填寫 ALT。"
                options:
                  format: html
                  switcher: true
                  media: false



          # ==================================================
          # H4 小標題
          # ==================================================

          - name: h4
            label: H4 小標題

            fields:
              - name: text
                label: 標題
                type: string
                required: true
                description: "較小層級的小標題。文章目錄主要段落建議仍使用文章中的 H2／H3。"



          # ==================================================
          # 重點提示
          # ==================================================
          #
          # 改成 Rich Text
          # 可以：
          # - 超連結
          # - 項目符號
          # - 編號清單
          # - 粗體
          # - Source HTML
          #
          # ==================================================

          - name: tip
            label: 重點提示

            fields:
              - name: title
                label: 標題
                type: string
                required: false
                default: "重點提示"

              - name: text
                label: 內容
                type: rich-text
                required: true
                options:
                  format: html
                  switcher: true
                  media: false



          # ==================================================
          # 注意事項
          # ==================================================

          - name: warning
            label: 注意事項

            fields:
              - name: title
                label: 標題
                type: string
                required: false
                default: "注意事項"

              - name: text
                label: 內容
                type: rich-text
                required: true
                options:
                  format: html
                  switcher: true
                  media: false



          # ==================================================
          # 步驟區塊
          # ==================================================

          - name: step
            label: 步驟區塊

            fields:
              - name: number
                label: 步驟編號
                type: string
                required: true
                description: "例如 01、02、03"


              - name: title
                label: 步驟標題
                type: string
                required: true


              - name: content
                label: 步驟內容
                type: rich-text
                required: true
                description: "步驟中的圖片請另外新增「圖片」區塊，以確保 ALT 完整。"
                options:
                  format: html
                  switcher: true
                  media: false



          # ==================================================
          # 補充資訊
          # ==================================================

          - name: note
            label: 補充資訊

            fields:
              - name: title
                label: 標題
                type: string
                required: false
                default: "補充資訊"


              - name: text
                label: 內容
                type: rich-text
                required: true
                options:
                  format: html
                  switcher: true
                  media: false



          # ==================================================
          # 常見問題 FAQ
          # ==================================================
          #
          # 新增一個 FAQ 區塊後，
          # 可以在裡面持續 Add an item
          #
          # ==================================================

          - name: faq
            label: 常見問題 FAQ

            fields:

              - name: title
                label: 區塊標題
                type: string
                required: false
                default: "常見問題"


              - name: items
                label: 問題與答案
                type: object
                required: true

                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: "{question}"

                fields:

                  - name: question
                    label: 問題
                    type: string
                    required: true


                  - name: answer
                    label: 回答
                    type: rich-text
                    required: true
                    options:
                      format: html
                      switcher: true
                      media: false



          # ==================================================
          # 圖片
          # ==================================================
          #
          # 所有文章圖片都建議透過這裡新增
          # ALT 設為必填
          #
          # ==================================================

          - name: image
            label: 圖片

            fields:

              - name: image
                label: 圖片
                type: image
                required: true
                options:
                  media: images
                  rename: safe


              - name: alt
                label: 圖片 ALT 文字
                type: string
                required: true
                description: "請描述圖片真正呈現的內容，例如：Notion 發布網站設定畫面。不要寫『圖片1』或只堆疊 SEO 關鍵字。"


              - name: caption
                label: 圖片說明
                type: string
                required: false
                description: "選填。顯示在圖片下方給讀者看的補充文字。"



          # ==================================================
          # YouTube
          # ==================================================

          - name: youtube
            label: YouTube 影片

            fields:

              - name: video_id
                label: YouTube 影片 ID
                type: string
                required: true
                description: "例如 https://youtu.be/1nIsbRfEGK4，只填 1nIsbRfEGK4"


              - name: title
                label: 影片標題
                type: string
                required: true
                description: "用於影片 iframe title 與無障礙說明"



          # ==================================================
          # 官方來源
          # ==================================================

          - name: source
            label: 官方來源

            fields:

              - name: label
                label: 顯示文字
                type: string
                required: true
                description: "例如 Notion 官方網站"


              - name: url
                label: 網址
                type: string
                required: true
                description: "請貼完整 https:// 網址"



          # ==================================================
          # 延伸閱讀
          # ==================================================

          - name: related
            label: 延伸閱讀

            fields:

              - name: title
                label: 文章名稱
                type: string
                required: true


              - name: url
                label: 文章網址
                type: string
                required: true
                description: "可以填站內文章網址或完整網址"



      # ==================================================
      # ⑤ SEO 進階設定
      # ==================================================

      - name: seo_title
        label: SEO 標題
        type: string
        required: false
        description: "選填。留白時直接使用文章標題；只有 Google 搜尋標題需要不同文字時才填。"


      - name: meta_description
        label: Meta Description
        type: text
        required: false
        description: "選填。Google 搜尋結果使用的說明文字。留白時網站可由快速解答或文章內容自動產生。"


      - name: noindex
        label: 不允許搜尋引擎索引
        type: boolean
        default: false
        required: false
        description: "開啟後，這篇文章不會出現在首頁、分類頁、標籤頁、站內搜尋、RSS 與 sitemap，也不會被搜尋引擎索引。草稿或測試文章用。"



      # ==================================================
      # ⑥ isoPOS 文末 CTA
      # ==================================================

      - name: cta_title
        label: 文末 CTA 標題
        type: string
        required: false
        description: "選填。留白時使用預設：想把數位工具真正整合進日常營運？"


      - name: cta_text
        label: 文末 CTA 銜接文字
        type: text
        required: false
        description: "選填。依文章內容自然銜接到 isoPOS，例如：如果你需要的不只是建立網站，而是希望整合線上預約、會員、LINE 與 POS，也可以進一步了解 isoPOS。"


      - name: cta_button
        label: 文末 CTA 按鈕文字
        type: string
        required: false
        description: "選填。留白時使用預設：了解 isoPOS"


      - name: cta_kicker
        label: 文末 CTA 上方小標
        type: string
        required: false
        description: "進階選填。留白時使用預設：FROM KNOWLEDGE TO WORKFLOW。填一個半形空格可以隱藏這一行。"
