{%- comment -%}
  麵包屑結構化資料。
  參數：crumb_name / crumb_url（第二層）；有 page.title 時自動當第三層。
{%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "首頁",
      "item": {{ '/' | absolute_url | jsonify }}
    }{% if include.crumb_name %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ include.crumb_name | jsonify }},
      "item": {{ include.crumb_url | absolute_url | jsonify }}
    }{% endif %}{% if include.leaf_name %},
    {
      "@type": "ListItem",
      "position": {% if include.crumb_name %}3{% else %}2{% endif %},
      "name": {{ include.leaf_name | strip_html | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }{% endif %}
  ]
}
</script>
